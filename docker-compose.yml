x-database-postgres-credentials: &database-postgres-credentials
  POSTGRES_USER: nlda
  POSTGRES_PASSWORD: nlda

x-app-common-environment: &app-common-environment
  SPRING_PROFILES_ACTIVE: full-postgres
  SERVER_PORT: 8080
  AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-deterministic}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  POSTGRES_USER: nlda
  POSTGRES_PASSWORD: nlda
  AGENT_DATASOURCE_ID: default
  AGENT_TENANT_ID: ""
  AGENT_MIGRATION_APP_ENABLED: ${AGENT_MIGRATION_APP_ENABLED:-true}
  AGENT_MIGRATION_GOVERNANCE_ENABLED: ${AGENT_MIGRATION_GOVERNANCE_ENABLED:-true}
  AGENT_MIGRATION_RETRIEVAL_ENABLED: ${AGENT_MIGRATION_RETRIEVAL_ENABLED:-true}
  AGENT_RETRIEVAL_EMBEDDING_PROVIDER: ${AGENT_RETRIEVAL_EMBEDDING_PROVIDER:-openai}
  AGENT_RETRIEVAL_EMBEDDING_MODEL: ${AGENT_RETRIEVAL_EMBEDDING_MODEL:-text-embedding-3-small}
  AGENT_RETRIEVAL_EMBEDDING_DIMENSIONS: ${AGENT_RETRIEVAL_EMBEDDING_DIMENSIONS:-64}

x-datasource-postgres-environment: &datasource-postgres-environment
  POSTGRES_APP_JDBC_URL: jdbc:postgresql://datasource-postgres:5432/nlda_app

x-governance-postgres-environment: &governance-postgres-environment
  POSTGRES_GOVERNANCE_JDBC_URL: jdbc:postgresql://governance-postgres:5432/nlda_governance

x-retrieval-postgres-environment: &retrieval-postgres-environment
  POSTGRES_RETRIEVAL_JDBC_URL: jdbc:postgresql://retrieval-postgres:5432/nlda_retrieval

services:
  postgres-database-server:
    image: pgvector/pgvector:pg17
    container_name: nlda-postgres-database-server
    environment:
      <<: *database-postgres-credentials
      POSTGRES_DB: nlda_app
    ports:
      - "5432:5432"
    volumes:
      - nlda-database-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlda -d nlda_app"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      default:
        aliases:
          - datasource-postgres
          - governance-postgres
          - retrieval-postgres

  app-full-postgres:
    build: .
    container_name: nlda-app-full-postgres
    depends_on:
      postgres-database-server:
        condition: service_healthy
    environment:
      <<:
        - *app-common-environment
        - *datasource-postgres-environment
        - *governance-postgres-environment
        - *retrieval-postgres-environment
    ports:
      - "8080:8080"

volumes:
  nlda-database-postgres-data:

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Admin</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<main class="admin-shell">
    <header class="topbar">
        <div>
            <h1>Agent Admin</h1>
            <p id="statusLine">Ready</p>
        </div>
        <a href="/">Query</a>
    </header>

    <nav class="tabs" aria-label="Admin sections">
        <button type="button" class="tab active" data-tab="rules">Business Rules</button>
        <button type="button" class="tab" data-tab="schema">Schema Index / Refresh</button>
        <button type="button" class="tab" data-tab="index">Retrieval Index / Rebuild</button>
        <button type="button" class="tab" data-tab="diagnostics">Retrieval Diagnostics</button>
    </nav>

    <section class="panel" id="rulesPanel">
        <div class="panel-header">
            <h2>Business Rules</h2>
            <button type="button" id="refreshRules">Refresh</button>
        </div>
        <div class="split">
            <form id="ruleForm" class="editor">
                <label>Rule ID<input name="id" required placeholder="rule.example"></label>
                <label>Name<input name="name" required placeholder="Example rule"></label>
                <label>Owner<input name="owner" required value="data-governance"></label>
                <label>Datasource<input name="datasourceId" required value="default"></label>
                <label>Tenant<input name="tenantId" placeholder="optional"></label>
                <label>Version<input name="version" type="number" min="1" value="1"></label>
                <label>Rule Text<textarea name="text" rows="4" required></textarea></label>
                <label>Schema Refs<input name="schemaRefs" placeholder="orders, orders.total_amount"></label>
                <label>Aliases<input name="aliases" placeholder="revenue, spending"></label>
                <button type="submit">Save Draft</button>
            </form>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Status</th>
                        <th>Owner</th>
                        <th>Version</th>
                        <th>Scope</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="rulesTable"></tbody>
                </table>
            </div>
        </div>
    </section>

    <section class="panel hidden" id="schemaPanel">
        <div class="panel-header">
            <h2>Schema Index / Refresh</h2>
            <button type="button" id="refreshSchema">Refresh Schema</button>
        </div>
        <dl class="summary">
            <dt>Fingerprint</dt>
            <dd id="schemaFingerprint">-</dd>
            <dt>Tables</dt>
            <dd id="schemaTableCount">0</dd>
        </dl>
    </section>

    <section class="panel hidden" id="indexPanel">
        <div class="panel-header">
            <h2>Retrieval Index / Rebuild</h2>
            <div class="actions">
                <button type="button" id="rebuildRules">Rebuild Rules</button>
                <button type="button" id="rebuildAll">Rebuild All</button>
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Chunk</th>
                    <th>Kind</th>
                    <th>Model</th>
                    <th>Active</th>
                    <th>Indexed</th>
                </tr>
                </thead>
                <tbody id="indexTable"></tbody>
            </table>
        </div>
    </section>

    <section class="panel hidden" id="diagnosticsPanel">
        <div class="panel-header">
            <h2>Retrieval Diagnostics</h2>
            <button type="button" id="refreshDiagnostics">Refresh</button>
        </div>
        <pre id="diagnosticsOutput"></pre>
    </section>
</main>
<script src="/js/admin.js"></script>
</body>
</html>

spring:
  application:
    name: natural-language-database-agent
  datasource:
    url: jdbc:h2:mem:nlda;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

agent:
  sql:
    default-limit: 100
    max-limit: 1000
  llm:
    provider: ${AGENT_LLM_PROVIDER:deterministic}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
    base-url: ${OPENAI_BASE_URL:}
    timeout: 30s
    max-retries: 1
    repair-retries: 1

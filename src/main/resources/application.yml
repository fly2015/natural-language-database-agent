spring:
  application:
    name: natural-language-database-agent
  datasource:
    url: jdbc:h2:mem:nlda;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

agent:
  sql:
    default-limit: 100
    max-limit: 1000

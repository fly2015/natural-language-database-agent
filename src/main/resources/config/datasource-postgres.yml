spring:
  datasource:
    url: ${POSTGRES_APP_JDBC_URL:${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/nlda_app}}
    username: ${POSTGRES_APP_USER:${POSTGRES_USER:nlda}}
    password: ${POSTGRES_APP_PASSWORD:${POSTGRES_PASSWORD:nlda}}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
